name: Release

# tag vX.Y.Z push → build NSpace.app → zip → create a GitHub Release with the assets
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build-app.sh uses the git commit count as the build number

      - name: Swift version
        run: swift --version

      - name: Build and package .app (version from VERSION, build number from the git count)
        run: |
          ./scripts/build-app.sh
          ditto -c -k --keepParent build/NSpace.app "NSpace-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "NSpace-${GITHUB_REF_NAME}.zip" | tee checksums.txt

      - name: Extract this version's CHANGELOG as the release notes
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v ver="$V" '$0 ~ "^## \\["ver"\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > release-body.md
          [ -s release-body.md ] || echo "(No separate CHANGELOG section for this release; see CHANGELOG.md in the repository.)" > release-body.md
          cat release-body.md

      - name: Create the Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          files: |
            NSpace-*.zip
            checksums.txt
