name: Release

# tag vX.Y.Z push → build HSpace.app → zip → create a GitHub Release with the assets
on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write   # the only permission this job uses: creating the Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # build-app.sh uses the git commit count as the build number
          persist-credentials: false

      - name: Swift version
        run: swift --version

      - name: Build and package .app (version from VERSION, build number from the git count)
        run: |
          ./scripts/build-app.sh
          ./scripts/check-bundle.sh
          ditto -c -k --keepParent build/HSpace.app "HSpace-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "HSpace-${GITHUB_REF_NAME}.zip" | tee checksums.txt

      - name: Extract this version's CHANGELOG as the release notes
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v ver="$V" '$0 ~ "^## \\["ver"\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > release-body.md
          [ -s release-body.md ] || echo "(No separate CHANGELOG section for this release; see CHANGELOG.md in the repository.)" > release-body.md
          cat release-body.md

      - name: Create the Release and upload assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: release-body.md
          files: |
            HSpace-*.zip
            checksums.txt
