name: CI

# Build, tests and lints for every pull request and every push to main.
on:
  pull_request:
  push:
    branches: [main, phase0/track-g] # phase0/track-g is temporary, to prove the workflow on a real runner.

permissions:
  contents: read

jobs:
  check:
    # Package.swift requires macOS 26, so the runner must carry the macOS 26 SDK (Xcode 26).
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Tests
        run: ./scripts/test.sh

      - name: Pod lint
        run: ./scripts/pod-lint-swift.sh

      - name: Grid lint (full audit)
        run: ./scripts/grid-lint.sh
        env:
          GRID_LINT_ALL: "1"
